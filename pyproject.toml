[project]
name = "sestdigital"
version = "0.1.0"
description = "SEO Content Agent that transforms internal knowledge from meeting transcripts and product documents into SEO-optimized website articles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "docling>=2.80.0",
    "langchain>=1.2.12",
    "langchain-anthropic>=1.3.5",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.1.2",
    "langsmith>=0.7.17",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.17.1",
    "requests>=2.32.5",
    "sentence-transformers>=5.3.0",
    "tavily-python>=0.7.23",
]
